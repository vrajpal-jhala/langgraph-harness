name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - .github/**
  pull_request:

jobs:
  # Branch protection requires `check` on every PR, so the docs/.github skip is decided here instead of in `paths-ignore`.
  scope:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.scope.outputs.relevant }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Detect whether source files changed
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RELEVANT=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              docs/*|.github/*) ;;
              *) RELEVANT=true ;;
            esac
          done < <(git diff --name-only "$BASE_SHA"...HEAD)

          echo "relevant=$RELEVANT" >> "$GITHUB_OUTPUT"
          if [ "$RELEVANT" = false ]; then
            echo "Only docs/.github files changed — skipping format, typecheck, lint and build." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  verify:
    needs: scope
    if: needs.scope.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    env:
      # onnxruntime-node's postinstall download has timed out over IPv6 on this runner before.
      NODE_OPTIONS: --dns-result-order=ipv4first
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci || npm ci || npm ci
      - run: npm run format:check
      - run: npm --prefix backend run typecheck
      - run: npm --prefix backend run lint
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run lint
      - run: npm run build

  # The required status: `verify` is skipped on purpose for docs-only PRs, so pass only if `scope` succeeded and, when source changed, `verify` did too.
  check:
    needs: [scope, verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require scope and verify to have done their job
        env:
          SCOPE: ${{ needs.scope.result }}
          VERIFY: ${{ needs.verify.result }}
          RELEVANT: ${{ needs.scope.outputs.relevant }}
        run: |
          if [ "$SCOPE" != "success" ]; then
            echo "::error::scope job finished as '$SCOPE'."
            exit 1
          fi
          if [ "$RELEVANT" = "true" ] && [ "$VERIFY" != "success" ]; then
            echo "::error::verify job finished as '$VERIFY'."
            exit 1
          fi
          echo "scope=$SCOPE relevant=$RELEVANT verify=$VERIFY" | tee -a "$GITHUB_STEP_SUMMARY"

  changelog-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require a version bump + changelog entry for source changes
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          CHANGED=$(git diff --name-only "$BASE_SHA"...HEAD)

          # Docs/meta-only PRs never need a version bump.
          NEEDS_BUMP=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              # Markdown under src is runtime content (e.g. the review agent's skill prompts), not docs.
              backend/src/*|frontend/src/*) NEEDS_BUMP=true ;;
              docs/*|*.md|.github/*|demo-fixtures/*|deployment/*|scripts/*) ;;
              *) NEEDS_BUMP=true ;;
            esac
          done <<< "$CHANGED"
          if [ "$NEEDS_BUMP" = false ]; then
            echo "Only docs/meta files changed — no version bump required." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Manual escape hatch for a source change with no user-facing effect.
          if gh pr view "$PR_NUMBER" --json labels -q '.labels[].name' | grep -qx "no-changelog-needed"; then
            echo "Labeled no-changelog-needed — skipping." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          BASE_VERSION=$(git show "$BASE_SHA:package.json" | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0,"utf8")).version)')
          HEAD_VERSION=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0,"utf8")).version)' < package.json)
          CHANGELOG_TOUCHED=$(git diff --name-only "$BASE_SHA"...HEAD -- CHANGELOG.md)

          if [ "$BASE_VERSION" = "$HEAD_VERSION" ] || [ -z "$CHANGELOG_TOUCHED" ]; then
            echo "::error::This PR changes source files but doesn't bump package.json's version and update CHANGELOG.md. Run /update-changelog, or label this PR 'no-changelog-needed' if it has no user-facing effect."
            exit 1
          fi

          echo "Version bumped $BASE_VERSION -> $HEAD_VERSION and CHANGELOG.md updated." | tee -a "$GITHUB_STEP_SUMMARY"
