server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /ws {
        proxy_pass http://backend:3698;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SSE stream endpoints — buffering must be off or events are held until the
    # response ends, which defeats the purpose of streaming
    location ~* ^/api/.+/stream$ {
        proxy_pass http://backend:3698;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # frontend never calls webhook routes
    location /api/ {
        proxy_pass http://backend:3698;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /auth/ {
        proxy_pass http://backend:3698;
        # $host strips the port; better-auth needs it to resolve its own address per request.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
